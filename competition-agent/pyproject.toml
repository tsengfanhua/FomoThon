[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "competition-agent-core"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
openai = ["openai>=2,<3", "tiktoken>=0.12,<1"]
# competition_agent.hub（比賽爬蟲與簡章分析）才需要；核心仍然只用標準函式庫
hub = ["httpx>=0.27,<1", "pydantic>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"competition_agent.db" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src：本套件；.：scripts/；..：上層資料夾的 shared/（competition_agent.hub 的測試需要）
pythonpath = ["src", ".", ".."]
